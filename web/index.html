<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autodrafter — Captain's Mode</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div id="setup" class="setup">
  <div class="setup-card">
    <h1>autodrafter</h1>
    <p class="sub">Prototip — Captain's Mode, tu împotriva algoritmului</p>

    <div class="field">
      <label>Partea ta</label>
      <div class="choice" id="sideChoice">
        <button class="opt selected" data-side="FP">
          <strong>First Pick</strong><span>banezi și alegi primul · ban-uri 3-2-2</span>
        </button>
        <button class="opt" data-side="FB">
          <strong>Second Pick</strong><span>adversarul acționează primul · ban-uri 4-1-2</span>
        </button>
      </div>
    </div>

    <div class="field">
      <label>Algoritmul adversarului</label>
      <div class="choice" id="algoChoice">
        <button class="opt" data-algo="greedy"><strong>Greedy</strong><span>referință · ~0,2 ms</span></button>
        <button class="opt" data-algo="alphabeta"><strong>Alfa-beta</strong><span>adâncime 4 · ~10 ms</span></button>
        <button class="opt selected" data-algo="mcts"><strong>MCTS</strong><span>800 iterații · ~0,5 s</span></button>
      </div>
    </div>

    <button id="start" class="primary">Începe draftul</button>

    <div class="instant">
      <div class="field">
        <label>Draft instant · algoritmul fiecărei părți · MCTS pe ambele ≈ 20 s</label>
        <div class="pair">
          <label class="pick-algo"><span>First Pick</span>
            <select id="algoFP">
              <option value="greedy">Greedy</option>
              <option value="alphabeta">Alfa-beta</option>
              <option value="mcts" selected>MCTS</option>
            </select></label>
          <label class="pick-algo"><span>Second Pick</span>
            <select id="algoFB">
              <option value="greedy">Greedy</option>
              <option value="alphabeta">Alfa-beta</option>
              <option value="mcts" selected>MCTS</option>
            </select></label>
        </div>
      </div>
      <button id="instant" class="secondary">Draft instant — algoritmii joacă ambele părți</button>
    </div>
    <p class="warn" id="modelWarn" hidden></p>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="team-clock" id="clockFP"></div>
    <div class="phase">
      <div class="phase-label" id="phaseLabel">—</div>
      <div class="timer" id="timer">30</div>
      <div class="phase-sub" id="phaseSub"></div>
    </div>
    <div class="team-clock right" id="clockFB"></div>
  </header>

  <div class="winbar" title="Probabilitatea estimată de câștig">
    <div class="winbar-fill" id="winFill"></div>
    <span class="winbar-label left"  id="winLeft">50%</span>
    <span class="winbar-label right" id="winRight">50%</span>
  </div>

  <main class="layout">
    <section class="center">
      <div class="filters">
        <input id="search" type="search" placeholder="Caută erou…" autocomplete="off">
        <label class="toggle"><input type="checkbox" id="showHints" checked> Sugestii</label>
      </div>
      <div class="heroes" id="grid"></div>
      <div class="confirm-bar">
        <div class="selected-info" id="selectedInfo">Selectează un erou</div>
        <button id="top1" class="secondary" disabled
                title="Joacă direct prima recomandare">Top 1</button>
        <button id="lock" class="primary" disabled>Confirmă</button>
      </div>
      <section class="hints" id="hints"></section>
      <button id="seeDraft" class="secondary see-draft">Vezi draftul</button>
    </section>

    <aside class="order">
      <h3>Ordinea draftului</h3>
      <div class="order-list" id="order"></div>
    </aside>
  </main>

  <div class="modal" id="draftModal" hidden>
    <div class="modal-card" role="dialog" aria-label="Draftul">
      <header class="modal-head">
        <h2>Draftul</h2>
        <button id="dmClose" class="modal-x" aria-label="Închide">✕</button>
      </header>
      <div id="dmBody"></div>
    </div>
  </div>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
